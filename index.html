<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SAPIENET MEAT 시연용 목업</title>
<style>
:root{--blue:#1565e8;--navy:#0a2a66;--red:#e5484d;--orange:#f76b15;--green:#14a04f;--bg:#f3f5f9;--card:#fff;--line:#e2e7ef;--text:#1b2233;--sub:#6c7689;--mute:#c4cad6}
*{box-sizing:border-box}
body{margin:0;font-family:"Malgun Gothic","맑은 고딕",system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:13px}
a{color:inherit;text-decoration:none}
/* 공통 헤더 */
.top{background:#fff;border-bottom:1px solid var(--line);padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{font-weight:900;font-size:17px;color:var(--navy);white-space:nowrap}.logo b{color:#14a04f}
.logo small{display:block;font-size:9px;color:var(--sub);font-weight:600;letter-spacing:.3px}
.search{flex:1;min-width:220px;display:flex;border:2px solid var(--blue);border-radius:6px;overflow:hidden;max-width:620px}
.search input{flex:1;border:0;padding:8px 10px;font-size:12px;outline:none;font-family:inherit}
.search button{border:0;background:var(--blue);color:#fff;padding:0 16px;cursor:pointer}
.utils{display:flex;gap:14px;align-items:center;color:var(--sub);font-size:11px}
.utils .ic{text-align:center;position:relative;cursor:default}
.badge{position:absolute;top:-6px;right:-8px;background:var(--red);color:#fff;border-radius:9px;font-size:9px;padding:0 4px;font-weight:700}
.user{font-weight:700;color:var(--text);font-size:12px}
nav.menu{background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 12px;overflow-x:auto}
nav.menu .tabs{display:flex}
nav.menu .tabs a{padding:12px 13px;white-space:nowrap;font-weight:600;color:#333;border-bottom:3px solid transparent}
nav.menu .tabs a.on{color:var(--blue);border-bottom-color:var(--blue);background:#eef4ff}
nav.menu .roles{margin-left:auto;display:flex;gap:6px;padding:6px 0}
.role{border:1px solid var(--blue);color:var(--blue);background:#fff;border-radius:6px;padding:5px 9px;font-size:11px;font-weight:700;cursor:pointer;white-space:nowrap}
.role.supp{border-color:#14a04f;color:#14a04f}
.role.on{background:var(--blue);color:#fff}.role.supp.on{background:#14a04f;color:#fff}
main{max-width:1240px;margin:0 auto;padding:14px 16px 30px}
/* 배너 */
.banner{background:linear-gradient(90deg,#0a2a66,#1d4fa8);color:#fff;border-radius:10px;padding:14px 18px;display:flex;align-items:center;gap:14px;margin-bottom:14px;flex-wrap:wrap}
.banner .num{background:#1f7ef5;font-weight:900;font-size:22px;border-radius:6px;padding:6px 12px;min-width:56px;text-align:center}
.banner h1{margin:0;font-size:21px}
.banner .bsub{font-size:12px;color:#d6e4ff;margin-top:3px}
.banner .quote{margin-left:auto;font-style:italic;font-size:12px;color:#d6e4ff;text-align:right}
/* 공통 블록 */
.grid{display:grid;gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}
.card h3{margin:0 0 10px;font-size:14px}
.sub{color:var(--sub);font-size:11px}
.kpi{font-size:21px;font-weight:800;color:var(--navy)}
.red{color:var(--red)}.green{color:var(--green)}.blue{color:var(--blue)}
.btn{display:inline-block;border:0;border-radius:6px;padding:8px 12px;background:var(--blue);color:#fff;font-weight:700;cursor:pointer;font-size:12px;font-family:inherit;text-align:center}
.btn.ghost{background:#fff;color:var(--blue);border:1px solid var(--blue)}
.btn.orange{background:var(--orange)}.btn.green{background:var(--green)}.btn.dark{background:var(--navy)}
.btn.sm{padding:4px 8px;font-size:11px}
.btn:disabled{background:#c9ced9;color:#fff;cursor:not-allowed}
.tag{display:inline-block;font-size:10px;padding:2px 6px;border-radius:4px;background:#e8efff;color:var(--blue);margin:0 3px 3px 0;white-space:nowrap}
.tag.r{background:#ffe6e6;color:var(--red)}.tag.g{background:#e3f7ea;color:var(--green)}.tag.o{background:#fff0e3;color:var(--orange)}.tag.y{background:#fff7d1;color:#8a6100}
.pill{display:inline-block;font-size:11px;padding:3px 9px;border-radius:12px;background:#eef1f6;color:#444;cursor:pointer;margin:2px}
.pill.on{background:var(--blue);color:#fff}
.meat{width:100%;aspect-ratio:4/3;border-radius:8px;background:linear-gradient(135deg,#c93c4a,#7a1822);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;text-align:center;padding:6px;font-size:12px}
.meat.b{background:linear-gradient(135deg,#d9a08a,#a85b47)}.meat.c{background:linear-gradient(135deg,#b8323f,#5e1019)}.meat.d{background:linear-gradient(135deg,#e8c3b0,#c28b75)}.meat.g{background:linear-gradient(135deg,#8aa98a,#4a6b4a)}
table{width:100%;border-collapse:collapse}
th,td{border-bottom:1px solid var(--line);padding:7px 6px;text-align:left;font-size:12px;vertical-align:middle}
th{background:#f0f3f9;font-weight:700}
input,select,textarea{border:1px solid #cdd5e2;border-radius:6px;padding:7px 8px;font-size:12px;font-family:inherit;width:100%;background:#fff}
label.l{font-size:11px;color:var(--sub);display:block;margin:8px 0 4px;font-weight:600}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.bar{height:9px;background:#e9edf5;border-radius:5px;overflow:hidden;flex:1}.bar i{display:block;height:100%;background:var(--blue)}
.note{font-size:11px;color:#7a5a00;background:#fff8dc;border:1px dashed #e0b43c;border-radius:6px;padding:6px 8px;margin-top:8px}
.steps{display:flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px;flex-wrap:wrap}
.step{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--sub)}
.step .c{width:26px;height:26px;border-radius:50%;background:#dfe5ef;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800}
.step.on{color:var(--text);font-weight:700}.step.on .c{background:var(--blue)}.step.done .c{background:var(--green)}
.arrow{color:var(--mute);margin:0 4px}
.qlinks{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.qlinks a{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px;display:block}
.qlinks a:hover{border-color:var(--blue)}
.hero{border-radius:10px;padding:22px;color:#fff;background:linear-gradient(110deg,#0a2a66 45%,#1f5fbf);min-height:200px;display:flex;flex-direction:column;justify-content:center}
.hero h2{margin:0 0 8px;font-size:24px;line-height:1.3}
.imgfake{background:linear-gradient(120deg,#7c1721,#c4424d 50%,#5e1019);border-radius:10px;min-height:180px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:8px;opacity:0;transition:.25s;pointer-events:none;font-size:12px;z-index:9}
.toast.show{opacity:.95}
.chart{display:flex;align-items:flex-end;gap:10px;height:150px;padding-top:10px;border-bottom:1px solid var(--line)}
.chart div{flex:1;text-align:center;font-size:10px;color:var(--sub)}
.chart i{display:block;background:#8fb8f7;border-radius:4px 4px 0 0;margin:0 auto 4px;width:70%}
.chart i.hi{background:var(--blue)}
.donut{width:150px;height:150px;border-radius:50%;margin:auto;position:relative}
.donut::after{content:attr(data-c);position:absolute;inset:38px;background:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;text-align:center;color:var(--navy)}
.stat{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px}
footer{text-align:center;color:var(--sub);font-size:11px;padding:18px}
@media (max-width:760px){.banner .quote{display:none}.grid.two,.grid.three,.grid.four{grid-template-columns:1fr!important}}
</style>
</head>
<body>

<div class="top">
  <div class="logo">🐂 SAPIENET <b>MEAT</b><small>CONDITION-TO-TRADE MARKET</small></div>
  <div class="search"><input id="q" placeholder="원하는 고기, 부위를 검색해 보세요. (예: 한우 등심 1kg, 삼겹살, 업소용 등)"><button onclick="go('products')">🔍</button></div>
  <div class="utils">
    <div class="ic">🕘<br>최근본상품</div>
    <div class="ic" onclick="go('cart')" style="cursor:pointer">🛒<span class="badge">3</span><br>장바구니</div>
    <div class="ic">🔔<span class="badge">12</span><br>알림</div>
    <div class="user">홍길동님 ▾</div>
  </div>
</div>

<nav class="menu">
  <div class="tabs" id="tabs"></div>
  <div class="roles">
    <button class="role" id="r-buyer" onclick="go('mypage')">👤 개인 구매자</button>
    <button class="role" id="r-biz" onclick="go('business')">👤 사업자 구매자</button>
    <button class="role supp" id="r-supp" onclick="go('supplier')">👤 공급자 담당자</button>
  </div>
</nav>

<main id="app"></main>
<footer>SAPIENET MEAT · 시연용 목업 · 예시 데이터 · 결제·주문·정산은 동작하지 않으며 어떤 정보도 저장되지 않습니다</footer>
<div class="toast" id="toast"></div>

<script>
/* ===== 예시 데이터 ===== */
const PRODUCTS = [
  {id:1,name:"한우 등심 1kg",sub:"마블링이 좋은 프리미엄 등심",price:62000,unit:"1kg",origin:"한우",tags:["한우","냉장","구이용"],cls:"",badge:"한우"},
  {id:2,name:"한돈 삼겹살 1kg",sub:"국내산 한돈, 선선한 삼겹살",price:18900,unit:"1kg",origin:"한돈",tags:["한돈","냉장","구이용"],cls:"b",badge:"한돈"},
  {id:3,name:"호주산 갈비살 1kg",sub:"쫄깃한 식감의 프리미엄 갈비살",price:28900,unit:"1kg",origin:"호주산",tags:["호주산","냉장","구이용"],cls:"c",badge:"호주산"},
  {id:4,name:"닭가슴살 1kg",sub:"담백하고 신선한 닭가슴살",price:12900,unit:"1kg",origin:"국내산",tags:["국내산","냉장","다이어트"],cls:"d",badge:"국내산"},
  {id:5,name:"우삼겹 1kg",sub:"고소한 맛의 수입산 우삼겹",price:19800,unit:"1kg",origin:"수입육",tags:["미국산","냉동","구이용"],cls:"c",badge:"수입육"},
  {id:6,name:"한돈 목살 1kg",sub:"풍부한 육즙의 국내산 목살",price:16900,unit:"1kg",origin:"한돈",tags:["한돈","냉장","구이용"],cls:"b",badge:"한돈"},
  {id:7,name:"한우 국거리 500g",sub:"진한 국물 맛의 한우 국거리",price:24900,unit:"500g",origin:"한우",tags:["한우","냉장","국거리용"],cls:"",badge:"한우"},
  {id:8,name:"한돈 불고기 1kg",sub:"얇게 썰어 양념에 좋은 불고기용",price:15900,unit:"1kg",origin:"한돈",tags:["한돈","냉장","불고기"],cls:"d",badge:"한돈"}
];
const ORDERS_BUYER = [
  {no:"202410200001",date:"2024. 10. 20 (월) 14:32",name:"한우 등심 1kg",qty:2,price:124000,st:0,tag:"일반주문"},
  {no:"202410180045",date:"2024. 10. 18 (금) 11:20",name:"한돈 삼겹살 500g",qty:3,price:56700,st:4,tag:"배송완료"},
  {no:"202410120067",date:"2024. 10. 12 (토) 16:03",name:"닭가슴살 2kg",qty:1,price:12900,st:4,tag:"배송완료"}
];
const REQS = [
  {id:"R-101",title:"한우 등심 1++ 100kg 정기 납품",who:"사업자 구매자",qty:"100kg",price:"희망 kg당 60,000원 이하",due:"2026-10-25",status:"공급자 응답 중",offers:3},
  {id:"R-102",title:"삼겹살 업소용 10kg 주 1회",who:"식당 사업자",qty:"10kg / 주 1회",price:"희망 kg당 17,000원 이하",due:"2026-10-30",status:"수정제안 도착",offers:1},
  {id:"R-103",title:"무항생제 닭가슴살 2kg 반복 구매",who:"개인 구매자",qty:"2kg / 월 1회",price:"협의",due:"2026-11-12",status:"조건 협의 중",offers:2}
];
const STEP_SET = ["장바구니","주문/결제","주문완료"];

/* ===== 메모리 상태 (새로고침 시 초기화, 저장 없음) ===== */
const S = {cart:[{id:1,qty:2},{id:2,qty:1},{id:3,qty:1}], tabs:{}, votes:{}, role:"buyer", pick:"", pay:"card", reqPicked:"A", priceMode:"price"};

/* ===== 유틸 ===== */
const $ = id => document.getElementById(id);
const won = n => (typeof n==="number" ? n.toLocaleString("ko-KR")+"원" : n);
function toast(m){const t=$("toast");t.textContent=m;t.classList.add("show");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("show"),1800);}
function go(r){ if(location.hash==="#"+r) render(); else location.hash=r; }
function setTab(k,v){S.tabs[k]=v;render();}
function meat(cls,label,h){return `<div class="meat ${cls||""}" style="${h?`aspect-ratio:${h}`:""}">${label||""}</div>`;}
function banner(n,title,sub){return `<div class="banner"><span class="num">${n}</span><div><h1>${title}</h1><div class="bsub">${sub}</div></div><div class="quote">“좋은 고기가 좋은 거래를 만듭니다.”</div></div>`;}
function steps(arr,cur){return `<div class="steps">${arr.map((s,i)=>`<span class="step ${i<cur?"done":i===cur?"on":""}"><span class="c">${i<cur?"✓":i+1}</span>${s}</span>${i<arr.length-1?'<span class="arrow">›</span>':""}`).join("")}</div>`;}
function dis(label){return `<button class="btn" disabled title="시연용: 실제 거래·결제는 동작하지 않습니다">${label}</button>`;}

/* ===== 공통 상단 탭 ===== */
const TABS = [["home","홈"],["products","상품"],["requestNew","조건요청"],["cart","주문 · 결제"],["mypage","내 구매실"],["supplier","내 공급실"],["requests","거래 제안 광장"],["newproduct","신상품 제안 · 개발"],["analysis","데이터 분석"],["help","고객센터"]];
const TAB_OF = {home:"home",products:"products",product:"products",cart:"cart",mypage:"mypage",business:"mypage",external:"mypage",rights:"mypage",analysis:"analysis",supplier:"supplier",requestNew:"requestNew",requests:"requests",requestDetail:"requests",newproduct:"newproduct",help:"help"};
function renderChrome(route){
  const cur = TAB_OF[route]||"home";
  $("tabs").innerHTML = TABS.map(([k,l])=>`<a href="#${k}" class="${cur===k?"on":""}">${l}</a>`).join("");
  $("r-buyer").className = "role"+(route==="mypage"||route==="external"||route==="rights"?" on":"");
  $("r-biz").className = "role"+(route==="business"?" on":"");
  $("r-supp").className = "role supp"+(route==="supplier"||route==="newproduct"?" on":"");
}

/* ===== S01 통합 홈 ===== */
function V_home(){return `
${banner("01","통합 홈 (메인 화면)","사피에넷 미트의 모든 서비스를 한 화면에서 시작하는 맞춤형 첫 화면")}
<div class="grid" style="grid-template-columns:2fr 1fr">
  <div class="hero">
    <div class="sub" style="color:#cfe2ff">SAPIENET MEAT</div>
    <h2>좋은 고기가<br><span style="color:#8fd3a6">좋은 거래를 만듭니다.</span></h2>
    <div style="margin-bottom:14px">원하는 조건의 고기를 만나고, 더 나은 거래를 만들어보세요.</div>
    <div class="row"><a class="btn" href="#products">고기 바로 구매하기 →</a><a class="btn" href="#requestNew" style="background:#fff;color:var(--navy)">원하는 조건 요청하기 →</a></div>
  </div>
  <div class="card">
    <h3>지금, 이런 고기가 많이 거래되고 있어요</h3>
    <div class="grid" style="grid-template-columns:1fr 1fr">${PRODUCTS.slice(0,4).map(p=>`<div>${meat(p.cls,"",null).replace('class="meat','style="height:70px" class="meat')}<div style="font-weight:700;margin-top:4px">${p.name.replace(/ \\d.*$/,"")}</div><div class="red" style="font-weight:800">${won(p.price)}</div></div>`).join("")}</div>
  </div>
</div>
<div class="grid four" style="grid-template-columns:repeat(5,1fr);margin:12px 0">
  <a class="card" href="#products"><h3>🔍 상품 찾기</h3><div class="sub">필요한 고기 바로 구매</div></a>
  <a class="card" href="#requestNew"><h3>📝 조건 요청하기</h3><div class="sub">원하는 조건의 고기 요청</div></a>
  <a class="card" href="#requests"><h3>🤝 거래 제안 광장</h3><div class="sub">새로운 거래 기회 확인</div></a>
  <a class="card" href="#external"><h3>🧾 기록 등록하기</h3><div class="sub">구매기록·영수증 등록</div></a>
  <a class="card" href="#analysis"><h3>📊 내 고기 경제실</h3><div class="sub">구매기록·분석·낮지</div></a>
</div>
<div class="grid" style="grid-template-columns:1.3fr 1fr">
  <div class="card">
    <h3>오늘의 거래 현황 <span class="sub">2024. 10. 20 기준 (예시)</span></h3>
    <div class="grid four" style="grid-template-columns:repeat(4,1fr)">
      <div class="stat"><div class="sub">전체 거래액</div><div class="kpi">4,320,000원</div><div class="red" style="font-size:11px">전일 대비 ▲ 8%</div></div>
      <div class="stat"><div class="sub">거래 건수</div><div class="kpi">152건</div><div class="blue" style="font-size:11px">전일 대비 ▼ 5%</div></div>
      <div class="stat"><div class="sub">신규 상품 등록</div><div class="kpi">287건</div><div class="sub">이번주 ▲ 12건</div></div>
      <div class="stat"><div class="sub">조건 요청 등록</div><div class="kpi">19건</div><div class="sub">이번주 ▲ 7건</div></div>
    </div>
    <h3 style="margin-top:14px">나에게 맞는 추천 상품 <span class="pill on">개인 추천</span><span class="pill">사업자 추천</span><span class="pill">조건맞춤 추천</span></h3>
    <div class="grid four" style="grid-template-columns:repeat(4,1fr)">${PRODUCTS.slice(4,8).map(p=>`<a href="#product/${p.id}">${meat(p.cls,"",null).replace('class="meat','style="height:80px" class="meat')}<div style="font-weight:700;margin-top:4px;font-size:12px">${p.name}</div><div class="red" style="font-weight:800;font-size:12px">${won(p.price)}</div></a>`).join("")}</div>
  </div>
  <div class="card">
    <h3>내 빠른 메뉴</h3>
    <div class="qlinks" style="grid-template-columns:1fr 1fr">
      <a href="#mypage"><b>주문내역</b><div class="sub">최근 주문 3건</div></a>
      <a href="#requests"><b>견적 요청 현황</b><div class="sub">진행중 2건</div></a>
      <a href="#requests"><b>내 거래 제안</b><div class="sub">확인할 제안 5건</div></a>
      <a href="#mypage"><b>찜한 상품</b><div class="sub">저장한 상품 12개</div></a>

const VIEWS = {home:V_home,products:V_products,product:V_product,cart:V_cart,mypage:V_mypage,business:V_business,external:V_external,analysis:V_analysis,supplier:V_supplier,requestNew:V_requestNew,requests:V_requests,requestDetail:V_requestDetail,newproduct:V_newproduct,rights:V_rights,help:V_help};
function render(){
  const [route,arg]=(location.hash||"#home").slice(1).split("/");
  const fn=VIEWS[route]||V_home;
  renderChrome(VIEWS[route]?route:"home");
  $("app").innerHTML=fn(arg);
  window.scrollTo(0,0);
}
window.addEventListener("hashchange",render);
$("q").addEventListener("keydown",e=>{if(e.key==="Enter")go("products");});
render();
